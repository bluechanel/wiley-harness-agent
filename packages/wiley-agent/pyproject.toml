[project]
name = "wiley-agent"
version = "0.1.0"
description = "UI-agnostic agent harness: provider-neutral LLM loop, tools, sessions, prompt assembly, and MCP."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "mcp>=1.28.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
