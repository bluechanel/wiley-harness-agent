[project]
name = "wiley-agent"
version = "0.1.0"
description = "All-in-one agent core: provider, tools, config, harness, sessions, and MCP (UI-agnostic)."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "mcp>=1.28.1",
    "ripgrep>=15.1.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
