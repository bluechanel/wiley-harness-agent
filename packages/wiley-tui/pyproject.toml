[project]
name = "wiley-tui"
version = "0.1.0"
description = "Textual TUI frontend for wiley-agent."
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
    "wiley-agent",
]

[project.scripts]
wiley-tui = "wiley_tui.main:main"

[tool.uv.sources]
wiley-agent = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
