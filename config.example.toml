[anthropic]
api_key = "your-api-key"
base_url = "https://api.anthropic.com"
model = "claude-sonnet-4-5"
max_tokens = 8192
thinking_budget_tokens = 4096

# 自动上下文压缩（可选）：上下文超过阈值时把较早历史总结为一条摘要。
# [compaction]
# max_context_tokens = 150000
# keep_recent = 8

# bash 命令分级（可选）：每条命令在执行前被判成 allow（直接跑）/ ask（弹审批
# 卡片让你拍板）/ deny（硬拒绝，连问都不问）。allow 与 deny 是在内置规则之上
# **追加**，不必重列 ls、cat、git status/diff/log 这些默认放行的只读命令。
# 规则语法："uv run pytest:*" 是 token 前缀匹配，"pwd" 是整条精确匹配。
# 注意：分级是分诊不是安全边界（静态分析 bash 不可能完备），真正的边界是审批。
# 把跑测试/构建这类命令写进 allow 等于允许无人值守地执行仓库内代码——工作区内
# 的 write/edit 本就自动放行，所以这是"能写文件 + 能自动跑"的组合，自己权衡。
# timeout 为默认超时秒数（单次调用可用 timeout 参数覆盖，上限 600 秒）。
# [bash]
# allow = ["uv run pytest:*", "uv sync", "uv build:*", "git branch:*"]
# deny = ["git push:*"]
# timeout = 120

# Agent Skills（可选）：dirs 为技能目录列表，每个技能是一个含 SKILL.md 的
# 子目录（frontmatter name/description + 正文指令 + 随包文件）。目录顺序即
# 优先级（同名先者胜），~ 会展开，相对路径按启动目录解析。
# 省略整段时默认 ["~/.claude/skills", ".claude/skills"]（对齐 Claude Code
# 的个人/项目目录）；dirs = [] 显式关闭 skills。
# [skills]
# dirs = ["~/.claude/skills", ".claude/skills"]

# 实时语音 agent（wy-realtime-agent）配置：url 为北京地域 WebSocket 地址，
# 把 {WorkspaceId}（含花括号）替换为真实业务空间 ID。
# [realtime]
# url = "wss://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime"
# api_key = "your-api-key"                  # DashScope API Key
# model = "qwen-audio-3.0-realtime-plus"
# voice = "longanqian"                      # 可选，仅首次会话配置生效
# instructions = ""                         # 可选，系统指令（人设/风格）
# mode = "server_vad"                       # 可选："server_vad" | "smart_turn"
# vad_threshold = 0.5                       # 可选，仅 server_vad，[-1.0, 1.0]
# vad_silence_ms = 800                      # 可选，仅 server_vad，[200, 6000]
# echo_suppression = true                   # 可选：true=AI 说话时闭麦（免耳机）；false=耳机模式，支持语音打断
# max_history_turns = 20                    # 可选，[1, 50]

# MCP server 配置（可选）：每个 [[mcp.servers]] 一个 server，
# 其工具以 mcp__<name>__<tool> 名称并入 agent 工具集。
# [[mcp.servers]]
# name = "fetch"
# transport = "stdio"
# command = "uvx"
# args = ["mcp-server-fetch"]
# env = { KEY = "value" }        # 可选，与默认安全环境变量合并

# [[mcp.servers]]
# name = "docs"
# transport = "http"
# url = "https://example.com/mcp"
# headers = { Authorization = "Bearer xxx" }   # 可选
