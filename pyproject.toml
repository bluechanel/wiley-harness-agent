[project]
name = "wiley-harness-agent"
version = "0.1.0"
description = "A minimal Codex CLI-inspired agent implemented in Python."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.0",
    "textual>=8.2.8",
]

[project.scripts]
wiley-harness-agent = "wiley_harness_agent.app:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
